<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Subscription Requests — AppMaker Egypt Admin</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="subscription.css">
</head>
<body>
<header id="header"><nav class="container nav"><a href="index.html" class="logo"><img class="logo-mark" src="assets/logo.png" alt="AppMaker Egypt" width="180" height="70"></a><div class="nav-tools"><a href="promotions-admin.html" class="button outline" style="font-size:.85rem">Promotions</a> <a href="subscription-activation.html" class="button outline" style="font-size:.85rem">Subscription Activation</a></div></nav></header>
<div class="adm-wrap">
  <div id="login-view" class="card login-card" hidden>
    <h1 style="font-size:1.3rem;margin-top:0">Subscription Requests</h1>
    <p class="sub-muted">Authorized administrator only.</p>
    <form id="login-form">
      <label class="field"><span>Email</span><input type="email" id="login-email" required autocomplete="username"></label>
      <label class="field"><span>Password</span><input type="password" id="login-password" required autocomplete="current-password"></label>
      <button class="button" type="submit" style="width:100%">Sign in</button>
      <p id="login-msg" class="msg error" role="alert"></p>
    </form>
  </div>

  <div id="admin-view" hidden>
    <div class="adm-head"><h1>Subscription Requests</h1><button id="signout-btn" class="button outline" type="button">Sign out</button></div>
    <p id="admin-msg" class="msg" role="status"></p>
    <div class="adm-filters">
      <label class="field"><span>Search</span><input id="q" placeholder="Name, clinic, phone, email, ID"></label>
      <label class="field"><span>Promotion</span><select id="f-promo"><option value="">All</option></select></label>
      <label class="field"><span>Submitted from</span><input id="f-from" type="date"></label>
      <label class="field"><span>Submitted to</span><input id="f-to" type="date"></label>
      <label class="field"><span>Payment</span><select id="f-pay"><option value="">All</option><option>pending</option><option>confirmed</option><option>rejected</option></select></label>
      <label class="field"><span>Form</span><select id="f-form"><option value="">All</option><option>submitted</option><option>complete</option><option value="needs_info">needs info</option></select></label>
      <label class="field"><span>Account setup</span><select id="f-acc"><option value="">All</option><option value="not_started">not started</option><option value="in_progress">in progress</option><option>completed</option></select></label>
      <label class="field"><span>Website setup</span><select id="f-web"><option value="">All</option><option value="not_started">not started</option><option value="in_progress">in progress</option><option>completed</option></select></label>
    </div>
    <p class="sub-muted" id="count"></p>
    <div class="adm-table-wrap">
      <table class="adm">
        <thead><tr><th>Submitted</th><th>Doctor</th><th>Clinic</th><th>Mobile</th><th>Promotion</th><th>Payment</th><th>Form</th><th>Account</th><th>Website</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>
</div>

<div id="detail" class="adm-detail" hidden>
  <div class="dialog">
    <div class="adm-head"><h2 style="margin:0;font-size:1.2rem" id="d-title"></h2><button id="d-close" class="button outline" type="button">Close</button></div>
    <div id="d-body"></div>
    <h3>Review actions</h3>
    <div class="adm-actions">
      <button class="button outline" data-set="formStatus=complete">Mark form complete</button>
      <button class="button outline" data-set="formStatus=needs_info">Request more information</button>
    </div>
    <div class="adm-actions">
      <button class="button" data-set="paymentStatus=confirmed">Confirm payment (manual)</button>
      <button class="button outline" data-set="paymentStatus=rejected">Reject payment</button>
      <button class="button outline" data-set="paymentStatus=pending">Back to pending</button>
    </div>
    <div class="adm-actions">
      <button class="button outline" data-set="websiteSetupStatus=in_progress">Website: in progress</button>
      <button class="button outline" data-set="websiteSetupStatus=completed">Website setup completed</button>
      <button class="button outline" data-set="accountSetupStatus=in_progress">Account: in progress</button>
      <button class="button outline" data-set="accountSetupStatus=completed">Clinic account setup completed</button>
    </div>
    <label class="field"><span>Internal notes (not visible to the customer)</span><textarea id="d-notes" maxlength="5000"></textarea></label>
    <div class="adm-actions"><button id="d-save-notes" class="button outline" type="button">Save notes</button> <a id="d-activate" class="button outline" href="#">Open activation record →</a></div>
    <p id="d-msg" class="msg" role="status"></p>
    <h3>Change history</h3>
    <div id="d-log" class="adm-log"></div>
  </div>
</div>
<script type="module" src="subscription-requests.js"></script>
</body>
</html>
